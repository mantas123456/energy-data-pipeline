name: Daily data refresh

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC, after the day-ahead auction results are published
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Optional: load history from this date first (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: energy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipeline" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@localhost:5432/energy
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
    steps:
      - name: Skip if the API key is not configured
        if: env.ENTSOE_API_KEY == ''
        run: |
          msg="ENTSOE_API_KEY secret is not set: skipping the daily refresh (no data fetched, nothing committed). Add the repository secret to enable it."
          echo "::notice title=Daily refresh skipped::$msg"
          echo "### Daily refresh skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/checkout@v4
        if: env.ENTSOE_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.ENTSOE_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
      - if: env.ENTSOE_API_KEY != ''
        run: pip install -e .

      - name: Backfill history
        if: env.ENTSOE_API_KEY != '' && inputs.backfill_start != ''
        run: pipeline restore && pipeline backfill --start "${{ inputs.backfill_start }}" && pipeline export

      - name: Restore, update, transform, check, forecast, export
        if: env.ENTSOE_API_KEY != ''
        run: pipeline daily

      - name: Commit data and reports
        if: env.ENTSOE_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail the run if a data quality check failed
        if: env.ENTSOE_API_KEY != ''
        run: pipeline check --strict
