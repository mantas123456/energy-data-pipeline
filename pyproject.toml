[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-pipeline"
version = "0.1.0"
description = "ENTSO-E electricity data pipeline: ingest, PostgreSQL, SQL models, quality checks, day-ahead forecast"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mantas Valantinavičius" }]
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "lxml>=5.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "holidays>=0.50",
  "matplotlib>=3.8",
  "tabulate>=0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pipeline = "energy_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energy_pipeline = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
